name: Build Release

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release

    - name: Rename Linux binary
      if: runner.os == 'Linux'
      run: mv build/editor build/editor-linux

    - name: Rename Windows binary
      if: runner.os == 'Windows'
      run: mv build/Release/editor.exe build/editor-windows.exe

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v6.0.${{ github.run_number }}
        name: Release v6.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: |
          build/editor-linux
          build/editor-windows.exe